[project]
name = "dr-votia"
version = "0.1.0"
description = "Dr. votIA — RAG agent over Colombian electoral data (hexagonal architecture)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "supabase>=2.9",
    "tqdm>=4.66",
    "typer>=0.12",
    "voyageai>=0.3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
dr-votia = "dr_votia.entrypoints.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_votia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible default rule set: pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dr_votia"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party SDKs without complete type stubs.
module = ["voyageai.*", "supabase.*", "fitz.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
